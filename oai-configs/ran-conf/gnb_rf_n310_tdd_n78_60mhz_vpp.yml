# This example configuration outlines how to configure the srsRAN Project gNB to create a single FDD cell
# transmitting in band 3, with 20 MHz bandwidth and 30 kHz sub-carrier-spacing. A USRP N3XX is configured
# as the RF frontend using split 8. Note in this example the internal GPDSO of the N310 is used.

cu_cp:
  amf:
    addr: 192.168.60.138
    port: 38412
    bind_addr: 192.168.50.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "41317"
            tai_slice_support_list:
              - sst: 2
              - sst: 3

# cu_up:
#   ngu:
#     socket:
#       - bind_addr: 127.0.3.1  # Address that the NG-U socket will bind to.
#         udp:
#           max_rx_msgs: 256    # Maximum packets read from the socket in a single syscall.
#           pool_threshold: 0.9 # Pool occupancy threshold, after which packets are dropped.
#           #dscp: 3             # Differentiated Services Code Point.

#       - bind_addr: 127.0.3.2  # Address that the NG-U socket will bind to.
#         udp:
#           max_rx_msgs: 256    # maximum packets read from the socket in a single syscall.
#           pool_threshold: 0.9 # Pool occupancy threshold, after which packets are dropped.
#           #dscp: 4             # Differentiated Services Code Point.

ru_sdr:
  device_driver: uhd
  device_args: type=n3xx
  clock: internal
  sync: internal
  srate: 122.88
  tx_gain: 65
  rx_gain: 75

cell_cfg:
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 100
  common_scs: 30
  plmn: "41317"
  tac: 1
  pci: 1
  # nof_antennas_dl: 2
  # nof_antennas_ul: 2
  slicing:
    - sst: 2
      sched_cfg:                              # Scheduler configuration for the slice
        min_prb_policy_ratio: 30                 # Optional UINT (0). Sets the minimum percentage of PRBs to be allocated to the slice. Supported [0 - 100].
        max_prb_policy_ratio: 50               # Optional UINT (100). Sets the maximum percentage of PRBs to be allocated to the slice. Supported [1 - 100].
    - sst: 3
      sched_cfg:                              
        min_prb_policy_ratio: 0                 
        max_prb_policy_ratio: 70
  pusch:
    min_k2: 2
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 4
    nof_dl_slots: 2
    nof_dl_symbols: 10
    nof_ul_slots: 1
    nof_ul_symbols: 0
    # pattern2:
    #   dl_ul_tx_period: 2                       # Optional INT (10). Sets the TDD pattern periodicity in slots. The combination of this value and the chosen numerology must lead to a TDD periodicity of 0.5, 0.625, 1, 1.25, 2, 2.5, 3, 4, 5 or 10 milliseconds. Supported: [2 - 80].
    #   nof_dl_slots: 0                           # Optional INT (6). Number of consecutive full Downlink slots. Supported: [0-80].
    #   nof_dl_symbols: 0                         # Optional INT (8). Number of Downlink symbols at the beginning of the slot following full Downlink slots. Supported: [0-13]
    #   nof_ul_slots: 1                           # Optional INT (3). Number of consecutive full Uplink slots. Supported: [0 - 80].
    #   nof_ul_symbols: 0                         # Optional INT (0). Number of Uplink symbols at the end of the slot preceding the first full Uplink slot. Supported: [0-13].

  pucch:
    sr_period_ms: 2
    min_k1: 2
  mac_cell_group:
    bsr_cfg:
      periodic_bsr_timer: 1

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
