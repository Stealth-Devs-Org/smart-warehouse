# This example configuration outlines how to configure the srsRAN Project gNB to create a single TDD cell
# transmitting in band 78, with 20 MHz bandwidth and 30 kHz sub-carrier-spacing. A USRP B200 is configured
# as the RF frontend using split 8. Note in this example an external clock source is not used, so the sync
# is not defined and the default is used.

# Quality of Service (QoS) example configurations for 5QI 1, 2, 5, 7 and 9
# Based on 5QI characteristics in TS 23.501 table 5.7.4-1 

# This is a supplementary configuration to modify the RLC and PDCP radio bearers on 
# a per 5QI basis.

# The default values are picked to try to acheive the QoS requirements defined in
# TS 23.501 -- System architecture for the 5G System, table 5.7.4-1.

cu_cp:
  inactivity_timer: 5
  amf:
    addr: 192.168.60.138
    port: 38412
    bind_addr: 192.168.1.12
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 2
              - sst: 3

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
  srate: 46.08
  otw_format: sc12
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  dl_arfcn: 632628  # Band n78, 3500 MHz
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30  # 30 kHz SCS, 0.5 ms slot duration
  plmn: "00101"
  tac: 1
  pci: 1
  # nof_antennas_dl: 1
  # nof_antennas_ul: 1
  # slicing:
  #   - sst: 2
  #     sched_cfg:                              # Scheduler configuration for the slice
  #       min_prb_policy_ratio: 30                 # Optional UINT (0). Sets the minimum percentage of PRBs to be allocated to the slice. Supported [0 - 100].
  #       max_prb_policy_ratio: 50               # Optional UINT (100). Sets the maximum percentage of PRBs to be allocated to the slice. Supported [1 - 100].
  #   - sst: 3
  #     sched_cfg:                              
  #       min_prb_policy_ratio: 0                 
