version: '3.8'
services:
    oai-gnb:
        image: oaisoftwarealliance/oai-gnb:v2.2.0
        privileged: true
        container_name: rfsim5g-oai-gnb
        environment: 
            RFSIMULATOR: server
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
        volumes:
            - /home/vipula/FYP-grp18/bash-scripts/ran-conf/gnb.sa.band78.fr1.106PRB.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
        networks:
            public_net:
                ipv4_address: 192.168.73.153
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue1:
        image: oaisoftwarealliance/oai-nr-ue:v2.2.0
        privileged: true
        container_name: rfsim5g-oai-nr-ue1
        environment: 
            RFSIMULATOR: 192.168.73.153
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 -C 3319680000 --numerology 1 --ssb 516 --log_config.global_log_options level,nocolor,time
        depends_on:
            - oai-gnb
        volumes:
            - /home/vipula/FYP-grp18/bash-scripts/ran-conf/ue1-sim.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        networks:
            public_net:
                ipv4_address: 192.168.73.154
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue2:
        image: oaisoftwarealliance/oai-nr-ue:v2.2.0
        privileged: true
        container_name: rfsim5g-oai-nr-ue2
        environment: 
            RFSIMULATOR: 192.168.73.153
            USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 -C 3319680000 --numerology 1 --ssb 516 --log_config.global_log_options level,nocolor,time
        depends_on:
            - oai-gnb
        volumes:
            - /home/vipula/FYP-grp18/bash-scripts/ran-conf/ue2.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        networks:
            public_net:
                ipv4_address: 192.168.73.155
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    public_net:
        driver: bridge
        name: demo-oai-public-net-2
        ipam:
            config:
                - subnet: 192.168.73.128/26
        driver_opts:
            com.docker.network.bridge.name: "demo-oai-2"

